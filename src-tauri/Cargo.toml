[package]
name = "helix"
version = "1.0.9"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1" # the plugins' settings in tauri.conf.json (generate_context!)
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
